services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./src/.env.dev
    # -------- replace with comment if you are using nginx --------
    ports:
      - "8011:8000"
    # expose:
    #   - "8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./src/app:/code/app
      - ./src/.env.dev:/code/.env
      - ./src/certs:/code/certs:ro
      - ./src/app/logs/app.log:/code/app/logs/app.log

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: arq app.core.worker.settings.WorkerSettings
    env_file:
      - ./src/.env.dev
    depends_on:
      - db
      - redis
    volumes:
      - ./src/.env.dev:/code/.env
      - ./src/app:/code/app

  db:
    image: postgres:latest
    env_file:
      - ./src/.env.dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # -------- replace with comment to run migrations with docker --------
    # expose:
    #   - "5432"
    ports:
      - 5432:5432

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    ports:
      - 6379:6379
    # expose:
    #   - "6379"


  # -------- create first superuser --------
  create_superuser:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./src/.env.dev
    depends_on:
      - db
      - web
    command: python -m src.scripts.create_first_superuser
    volumes:
      - ./src:/code/src
      - ./src/.env.dev:/code/.env
      - ./src/certs:/code/certs:ro
  create_cities:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./src/.env.dev
    depends_on:
      - db
      - web
    command: python -m src.scripts.create_cities
    volumes:
      - ./src:/code/src
      - ./src/.env.dev:/code/.env
      - ./src/certs:/code/certs:ro
      - ./src/scripts/sample_data:/code/scripts/sample_data
  create_hotel_categories:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./src/.env.dev
    depends_on:
      - db
      - web
    command: python -m src.scripts.create_categories
    volumes:
      - ./src:/code/src
      - ./src/.env.dev:/code/.env
      - ./src/certs:/code/certs:ro
      - ./src/scripts/sample_data:/code/scripts/sample_data
  create_room_types:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./src/.env.dev
    depends_on:
      - db
      - web
    command: python -m src.scripts.create_rooms
    volumes:
      - ./src:/code/src
      - ./src/.env.dev:/code/.env
      - ./src/certs:/code/certs:ro
      - ./src/scripts/sample_data:/code/scripts/sample_data
  create_amenities:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./src/.env.dev
    depends_on:
      - db
      - web
    command: python -m src.scripts.create_amenities
    volumes:
      - ./src:/code/src
      - ./src/.env.dev:/code/.env
      - ./src/certs:/code/certs:ro
      - ./src/scripts/sample_data:/code/scripts/sample_data

